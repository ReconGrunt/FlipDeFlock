# Keeps the SHA-pinned actions in .github/workflows from going stale.
#
# Pinning to a commit is what makes a release reproducible, but a pin nobody
# ever moves is just an old dependency with extra steps. Dependabot reads the
# `# vX.Y.Z` comment beside each pin, and bumps the SHA and the comment
# together, so updates arrive as reviewable PRs instead of arriving silently
# whenever an upstream tag moves.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    # Major kept apart from the rest, because the two deserve different
    # attention. A major here can change runner requirements or artifact
    # behaviour, and the release path is only exercised by tagging, so waving one
    # through costs nothing until it costs a release. Ungrouped, four separate
    # green PRs each carrying a major bump read as routine; one PR marked major
    # reads as something to look at.
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
