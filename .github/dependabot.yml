# Keeps the SHA-pinned actions in .github/workflows from going stale.
#
# Pinning to a commit is what makes a release reproducible, but a pin nobody
# ever moves is just an old dependency with extra steps. Dependabot reads the
# `# vX.Y.Z` comment beside each pin, and bumps the SHA and the comment
# together, so updates arrive as reviewable PRs instead of arriving silently
# whenever an upstream tag moves.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    # Grouped, and major kept apart from the rest.
    #
    # Ungrouped, the first run after this config landed opened four separate PRs
    # that each carried a major bump: checkout 4 to 7, upload-artifact 4 to 7,
    # download-artifact 4 to 8, action-gh-release 2 to 3. Four small green PRs
    # read as routine. The same four as one PR titled "major" reads as a thing to
    # look at, which is what a major bump of a release-path action deserves.
    #
    # The split matters more than the grouping. A major here can change runner
    # requirements or artifact behaviour, and the release path is only exercised
    # by tagging, so the cost of waving one through is paid later and in public.
    # Patch and minor can stay boring.
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
