name: "FAP: Nightly"

# A rolling prerelease built from main, so there is always a working fallback
# that is NOT the newest tag.
#
# WHY THIS EXISTS: v0.69 shipped a fix that did not hold and had to be corrected
# in v0.70. Between those two tags the only published build was the broken one,
# and "wait for the next tag" was the only advice available. A nightly gives the
# other direction too -- a fix can be tested by the person who reported it before
# it is frozen into a tag.
#
# THE STABLE CHANNEL IS UNAFFECTED, and that is the whole design constraint:
# every release here is marked `prerelease`, which keeps it out of
# /releases/latest. Anyone following the README's "latest release" link keeps
# getting the newest TAG, not this. Nothing about this workflow can change what a
# normal user downloads.
#
# THE COMPANION FIRMWARE IS BUILT HERE TOO, as of v0.77. It used to be .fap only,
# on the reasoning that a nightly .fap could pair with the companion image from
# the newest tag because "the proto version handshake already detects a genuine
# mismatch and says so, rather than misbehaving quietly."
#
# That reasoning does not cover a DETECTION-TABLE change, and v0.77 is exactly
# one. Adding five vendor OUI tables changes what the companion reports, not the
# protocol it speaks, so the handshake sees nothing wrong and stays silent --
# while an old companion simply never reports the new vendors. The nightly then
# ships an app whose headline feature is inert, with no indication to the person
# testing it. That is the quiet misbehaviour the old note believed was ruled out.
#
# It costs about four extra minutes of CI per nightly, which is cheap next to
# shipping a build that cannot do the thing it was cut for.
on:
  schedule:
    # 07:00 UTC daily. After a normal evening of commits in the Americas, and it
    # is a fixed wall-clock time rather than "every push", so a run of doc
    # commits does not publish five nightlies in an afternoon.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write # create/replace the rolling `nightly` release and its tag

# Two runs must never interleave: publish below DELETES the nightly release and
# recreates it, so an overlapping pair can leave no nightly at all. Queue instead
# of cancelling -- a cancelled run mid-delete is the state we are avoiding.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Is there anything new to publish? The nightly release records the commit it
  # was built from, so re-publishing an identical build every morning is both
  # avoidable and actively misleading: a moving date on an unchanged binary
  # reads as progress.
  #
  # Also the fork guard. Scheduled workflows run on a fork's default branch once
  # its owner enables Actions, and this one writes releases -- so pin it to this
  # repository rather than letting a fork publish "FlipDeFlock nightly".
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'ReconGrunt/FlipDeFlock'
    name: "Anything new since the last nightly?"
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false

      - name: Compare main against the published nightly
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          # A hand-run should always publish. That is what the button is for:
          # you press it because you want a nightly out of the current main,
          # not to be told nothing changed.
          FORCED: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ "$FORCED" = "true" ]; then
            echo "manual run: building regardless of what is already published."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `|| true`: no nightly release yet is the FIRST-RUN case, not an
          # error. Under `set -e` this assignment would otherwise kill the job
          # on the one day it most needs to succeed.
          published="$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"

          if [ -z "$published" ]; then
            echo "no nightly published yet; building the first one."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          elif [ "$published" = "$SHA" ]; then
            echo "nightly already points at $SHA; nothing new to build."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved: $published -> $SHA."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  # Same matrix and the same shared naming action as build.yml and release.yml,
  # so a nightly .fap is named exactly like the tagged one and lands in the same
  # place on the SD card. A user testing a nightly and then going back to stable
  # should be overwriting one file, not learning a second filename.
  build:
    needs: check
    if: needs.check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    name: "Build .fap (${{ matrix.target }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ofw
            api: "87.1"
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            api: "88.3"
            index: https://up.unleashedflip.com/directory.json
          # RM doesn't have a directory.json, however its close enough to unleashed
          - target: roguemaster
            api: "88.3"
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            api: "87.1"
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      # The nightly is the job that tracks a MOVING upstream -- it rebuilds daily
      # against each firmware's live release channel, so it sees an API bump the
      # day it lands. build.yml only runs on push, which is why unlshd-091's
      # 88.2 -> 88.3 went unreported for two nightlies.
      - name: API drift check (advisory)
        continue-on-error: true
        uses: ./.github/actions/api-drift
        with:
          expected-api: ${{ matrix.api }}
          target: ${{ matrix.target }}

      - name: Name the .fap for this firmware
        id: fap
        uses: ./.github/actions/name-fap
        with:
          fap-artifacts: ${{ steps.build-app.outputs.fap-artifacts }}
          target: ${{ matrix.target }}

      - name: Upload .fap for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fap-${{ matrix.target }}
          path: ${{ steps.fap.outputs.path }}
          if-no-files-found: error

  # Mirrors esp32.yml's build-bin, including the 2.0.17 core pin -- the version
  # the RELEASED WROOM image is built from. A nightly companion built against a
  # different core than the tagged one would make "flash the nightly, keep your
  # tagged companion" a comparison of two variables at once.
  companion:
    needs: check
    runs-on: ubuntu-latest
    name: "Build flock_companion .bin"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Install ESP32 core
        run: |
          # RETRY THE INDEX FETCH. downloads.arduino.cc reset the connection
          # mid-release on 2026-08-30 ("Download failed: performing HEAD request
          # ... read: connection reset by peer", then "Some indexes could not be
          # updated"). That failed the C5 job, which meant its asset never
          # attached, which made the SHA256SUMS job correctly refuse to publish a
          # manifest with a missing file -- so one dropped TCP connection took out
          # the whole release and needed a human to notice and re-run it.
          #
          # Nothing about that failure was our code, and nothing about it was
          # worth a red release. Three attempts with a backoff, and the step still
          # fails loudly if the index is genuinely unreachable.
          retry() {
            local n=1
            until "$@"; do
              if [ "$n" -ge 3 ]; then
                echo "::error::failed after $n attempts: $*"
                return 1
              fi
              echo "attempt $n failed: $* -- retrying in $((n * 10))s"
              sleep $((n * 10))
              n=$((n + 1))
            done
          }
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          retry arduino-cli core update-index
          retry arduino-cli core install esp32:esp32@2.0.17

      - name: Compile (classic ESP32 / WROOM)
        run: |
          # huge_app: WiFi + BLE firmware exceeds the default 1.3 MB app partition.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir build_esp \
            esp32_companion/flock_companion

      - name: Merge into a single flashable image
        run: |
          python -m pip install --quiet esptool
          BOOT0=$(find "$HOME/.arduino15" -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32 merge_bin -o build_esp/flipdeflock_companion_esp32wroom.bin \
            0x1000  build_esp/flock_companion.ino.bootloader.bin \
            0x8000  build_esp/flock_companion.ino.partitions.bin \
            0xe000  "$BOOT0" \
            0x10000 build_esp/flock_companion.ino.bin
          # Same unpadded assertion esp32.yml makes: a padded image would be
          # 4 MB of 0xFF that the Flipper dutifully writes over UART.
          python - <<'PY'
          import pathlib
          p = pathlib.Path("build_esp/flipdeflock_companion_esp32wroom.bin")
          d = p.read_bytes()
          assert d[0x1000] == 0xE9, f"bootloader magic missing at 0x1000 (got {d[0x1000]:#04x})"
          assert len(d) < 3_000_000, f"image looks padded to flash size: {len(d):,} bytes"
          print(f"WROOM image OK: {len(d):,} bytes, bootloader magic at 0x1000")
          PY

      - name: Upload the companion image for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-companion-bin
          path: build_esp/flipdeflock_companion_esp32wroom.bin
          if-no-files-found: error

  publish:
    needs: [build, companion]
    runs-on: ubuntu-latest
    name: "Publish the rolling nightly"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false
          # Full history: the notes below list what has landed since the newest
          # tag, which needs the tags and the commits between them.
          fetch-depth: 0

      - name: Collect the built .fap files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-fap-*
          merge-multiple: true
          path: faps

      - name: Collect the companion image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-companion-bin
          path: faps

      # The .bin has to be here or the release is the half-build this job was
      # changed to stop publishing. Checked separately from the .fap count so
      # the error names which half went missing.
      - name: Check the companion image is present
        run: |
          set -euo pipefail
          if [ ! -s faps/flipdeflock_companion_esp32wroom.bin ]; then
            echo "::error::companion image missing; the nightly would ship an app whose new detections cannot fire."
            ls -lR faps || true
            exit 1
          fi
          ls -l faps/flipdeflock_companion_esp32wroom.bin

      # The same set check release.yml runs. A nightly that publishes three .fap
      # files instead of four is a nightly that silently drops a firmware
      # family, and the person it drops is the one testing an unreleased fix.
      - name: Check the collected .fap set
        run: |
          set -euo pipefail
          n="$(find faps -maxdepth 1 -name '*.fap' | wc -l)"
          if [ "$n" -ne 4 ]; then
            echo "::error::expected 4 .fap files from the build matrix, got $n."
            ls -lR faps || true
            exit 1
          fi
          ls -l faps

      # Delete-then-create rather than an update in place. A rolling tag has to
      # MOVE to the new commit, and the release actions that attach to an
      # existing tag leave the tag where it was -- which would publish today's
      # binaries under a tag pointing at last week's source. Deleting the tag
      # with the release is what makes `--target` below meaningful.
      - name: Replace the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          short="$(git rev-parse --short "$SHA")"

          {
            echo "**Untested build from \`main\`.** This is not a release."
            echo
            echo "Built from \`$short\`. Use it to test a fix before it is tagged,"
            echo "or as a fallback when the newest tag has a problem. For normal use"
            echo "take the [latest release](../../releases/latest) instead."
            echo
            echo "Install is identical to a tagged build: take the \`.fap\` matching"
            echo "your firmware from the table in the README."
            echo
            echo "**Flash the companion firmware from this release too.**"
            echo "\`flipdeflock_companion_esp32wroom.bin\` is built from the same"
            echo "commit as the \`.fap\` above and is attached here."
            echo
            echo "This matters more than it used to. Detection tables live on the"
            echo "companion, so an app change that adds new detections does"
            echo "nothing at all until the companion is reflashed, and the"
            echo "protocol handshake will NOT warn you: the protocol is"
            echo "unchanged, only what the companion looks for."
            echo
            # Only when there is actually something between the tag and here.
            # Right after a release the nightly IS the tagged commit, and an
            # empty "Since v0.71" heading reads like the list failed to
            # generate rather than like there is nothing in it.
            since="$(git log --no-merges --format='- %s' "$latest_tag..$SHA" 2>/dev/null || true)"
            if [ -n "$latest_tag" ] && [ -n "$since" ]; then
              echo "### Since \`$latest_tag\`"
              echo
              printf '%s\n' "$since"
            elif [ -n "$latest_tag" ]; then
              echo "Identical to [\`$latest_tag\`](../../releases/tag/$latest_tag)."
              echo "Nothing has landed on \`main\` since that release."
            fi
          } > notes.md
          cat notes.md

          # `|| true`: there is no nightly to delete on the first run, and that
          # must not fail the job.
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          # --prerelease is the load-bearing flag. Without it this becomes
          # /releases/latest and every README install link starts serving an
          # untested build.
          gh release create nightly \
            --prerelease \
            --target "$SHA" \
            --title "Nightly ($short)" \
            --notes-file notes.md \
            faps/*.fap \
            faps/flipdeflock_companion_esp32wroom.bin

          gh release view nightly --json isPrerelease,targetCommitish,assets \
            --jq '"prerelease=\(.isPrerelease) target=\(.targetCommitish) assets=\([.assets[].name]|join(", "))"'
