name: "FAP: Release"

# On a pushed tag matching v* (e.g. v1.2.0): build the FAP with the SAME
# ufbt-action as build.yml and attach flipdeflock.fap to that tag's GitHub
# Release.
#
# Resilient by design: the maintainer currently creates releases MANUALLY (via
# the GitHub API) before/after tagging. So this workflow must NOT fail if a
# release already exists, and must NOT create a conflicting duplicate.
# softprops/action-gh-release attaches to an existing release for the tag if one
# is present (and creates one only if it is absent), and we set
# fail_on_unmatched_files: false so a transient miss won't turn the run red.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update the Release and upload assets

jobs:
  # One .fap per firmware family. Mirrors build.yml's matrix exactly, so a tagged
  # build matches what CI builds on main -- keep the two lists in step.
  build:
    runs-on: ubuntu-latest
    name: "Build .fap (${{ matrix.target }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ofw
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      # Filters ufbt's artifact list to the single .fap and gives it this
      # target's release filename. Shared with build.yml so the CI artifact and
      # the release asset can never be named differently. It fails loudly on an
      # empty or ambiguous result: the attach step below used to run with
      # fail_on_unmatched_files: false, which would have published a release with
      # NO app in it if the artifact path ever moved, and stayed green doing it.
      - name: Name the .fap for this firmware
        id: fap
        uses: ./.github/actions/name-fap
        with:
          fap-artifacts: ${{ steps.build-app.outputs.fap-artifacts }}
          target: ${{ matrix.target }}

      - name: Upload .fap for the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fap-${{ matrix.target }}
          path: ${{ steps.fap.outputs.path }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    name: "Attach .fap files to release"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # All three builds, into one directory, so the attach below is a single call.
      # Attaching from inside the matrix instead would race three jobs against one
      # release, and generate_release_notes would fire three times.
      - name: Collect the built .fap files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fap-*
          merge-multiple: true
          path: faps

      - name: Show what will be attached
        run: ls -l faps

      # Pack the desktop asset pack and attach it too.
      #
      # SEPARATE from the .fap on purpose, unlike the QR plugin above. The plugin
      # is embedded because it is part of the app; this is not -- it replaces the
      # FIRMWARE's desktop animations, installs to a different place on the SD
      # card, and is entirely optional. Bundling it into the .fap would be
      # impossible anyway, since the firmware reads it from /ext/asset_packs.
      #
      # Frames are committed as .png sources and packed to .bm here, using the
      # SDK's own icon packer rather than a reimplementation: the format is a
      # heatshrink payload behind a 4-byte header, and getting it subtly wrong
      # produces files that look fine and render as garbage.
      - name: Pack asset pack
        run: |
          set -euo pipefail
          python -m pip install --quiet heatshrink2 pillow
          python tools/pack_assets.py asset_packs/FlipDeFlock dist/asset_pack/FlipDeFlock
          cd dist/asset_pack
          zip -qr ../../flipdeflock_asset_pack.zip FlipDeFlock
          cd ../..
          ls -l flipdeflock_asset_pack.zip

      # Attach the built .fap to the Release for this tag.
      # - If the maintainer already created the release manually, this updates it
      #   (does not create a duplicate).
      # - The maintainer may also upload/release manually; this just automates it.
      - name: Attach .fap to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            faps/*.fap
            flipdeflock_asset_pack.zip
          fail_on_unmatched_files: true
          # Auto-generate "What's Changed" notes when THIS workflow creates the
          # release (tag pushed with no release yet). If the maintainer pre-created
          # the release with hand-written notes, the action just attaches the .fap
          # and leaves those notes intact.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Publish SHA256SUMS.txt covering EVERY asset on the release.
  #
  # WHY: a re-upload of this project once passed itself off as official, and a
  # user had no way to tell the difference. Checksums do not stop a clone -- the
  # GPL allows one -- but they let anyone prove whether the file they hold is the
  # one this repo built. TRADEMARK.md points here.
  #
  # The wait is the awkward part and it is deliberate. The companion firmware is
  # attached by a SEPARATE workflow (esp32.yml) running in parallel on the same
  # tag, so hashing immediately would produce a checksum file that silently omits
  # the largest download -- worse than publishing none, because it looks complete.
  # So poll until it lands, and fail loudly rather than publish a partial list.
  checksums:
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    name: "Publish SHA256SUMS.txt"
    steps:
      - name: Wait for every asset, then checksum them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job deliberately has no checkout -- it only needs the API. But
          # `gh` resolves the repo from a git remote by default, so without this
          # every call dies with "not a git repository" and the poll below reads
          # that as "asset not there yet". v0.69 burned the full 10 minutes and
          # failed on an asset that had been present the whole time.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          # EVERY asset attached by esp32.yml, one per line. The C5 image is not
          # optional here just because it is experimental: it is a download, so a
          # SHA256SUMS.txt without it is the exact "looks complete but is not"
          # file this job exists to avoid.
          #
          # The two images come from DIFFERENT jobs in esp32.yml (build-bin and
          # build-core3), which start together but do not finish together, so
          # waiting on the WROOM image says nothing about the C5 one. On v0.69 the
          # C5 image happened to land first and got hashed; nothing made that
          # happen, and it would have been omitted silently if it had not.
          WANT: |
            flipdeflock_companion_esp32wroom.bin
            flipdeflock_companion_esp32c5_EXPERIMENTAL.bin
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            # `|| true`: a transient API error must read as "not there yet" and be
            # retried, not kill the job. Under `set -e` an unguarded assignment
            # from a failing command would exit on the first hiccup.
            have="$(gh release view "$TAG" --json assets --jq '.assets[].name' || true)"
            missing=""
            while read -r want; do
              [ -z "$want" ] && continue
              printf '%s\n' "$have" | grep -qx "$want" || missing="$missing $want"
            done <<< "$WANT"

            if [ -z "$missing" ]; then
              echo "every expected asset present after $((i-1)) polls."
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::never appeared on $TAG (waited 10 min):$missing." \
                   "Refusing to publish a SHA256SUMS.txt that omits them."
              exit 1
            fi
            echo "waiting for$missing ($i/40)"
            sleep 15
          done

          mkdir -p sums
          cd sums
          gh release download "$TAG" --clobber
          # A re-run would otherwise hash the previous checksum file into itself.
          rm -f SHA256SUMS.txt
          sha256sum -- * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
