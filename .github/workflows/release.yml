name: "FAP: Release"

# On a pushed tag matching v* (e.g. v1.2.0): build the FAP with the SAME
# ufbt-action as build.yml and attach flipdeflock.fap to that tag's GitHub
# Release.
#
# Resilient by design: the maintainer currently creates releases MANUALLY (via
# the GitHub API) before/after tagging. So this workflow must NOT fail if a
# release already exists, and must NOT create a conflicting duplicate.
# softprops/action-gh-release attaches to an existing release for the tag if one
# is present (and creates one only if it is absent), and we set
# fail_on_unmatched_files: false so a transient miss won't turn the run red.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required to create/update the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    name: "Build .fap and attach to release"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          # Mirror build.yml: floating official release SDK. Kept identical so a
          # tagged build matches what CI builds on main. (See the API drift guard
          # in build.yml if the SDK ever moves off API 87.1.)
          sdk-channel: release

      # ufbt's fap-artifacts output lists EVERY image it built, which since v0.51
      # includes the QR plugin's flipdeflock_qr.fal. That .fal already ships
      # INSIDE flipdeflock.fap as an embedded file asset, so attaching it to the
      # release as well only invites "do I need to copy this too?" -- the answer
      # is no, and the install is meant to be one file. Filter to the .fap(s).
      #
      # Fails loudly on an empty result on purpose. The attach step below used to
      # run with fail_on_unmatched_files: false, which would have published a
      # release with NO app in it if the artifact path ever moved, and stayed
      # green while doing it.
      - name: Select release assets (.fap only)
        id: assets
        env:
          FAP_ARTIFACTS: ${{ steps.build-app.outputs.fap-artifacts }}
        run: |
          set -euo pipefail
          faps="$(printf '%s\n' "$FAP_ARTIFACTS" | grep '\.fap$' || true)"
          if [ -z "$faps" ]; then
            echo "::error::ufbt produced no .fap -- refusing to publish an empty release."
            exit 1
          fi
          echo "Attaching:"
          echo "$faps"
          {
            echo 'files<<FAPEOF'
            echo "$faps"
            echo 'FAPEOF'
          } >> "$GITHUB_OUTPUT"

      # Pack the desktop asset pack and attach it too.
      #
      # SEPARATE from the .fap on purpose, unlike the QR plugin above. The plugin
      # is embedded because it is part of the app; this is not -- it replaces the
      # FIRMWARE's desktop animations, installs to a different place on the SD
      # card, and is entirely optional. Bundling it into the .fap would be
      # impossible anyway, since the firmware reads it from /ext/asset_packs.
      #
      # Frames are committed as .png sources and packed to .bm here, using the
      # SDK's own icon packer rather than a reimplementation: the format is a
      # heatshrink payload behind a 4-byte header, and getting it subtly wrong
      # produces files that look fine and render as garbage.
      - name: Pack asset pack
        run: |
          set -euo pipefail
          python -m pip install --quiet heatshrink2 pillow
          python tools/pack_assets.py asset_packs/FlipDeFlock dist/asset_pack/FlipDeFlock
          cd dist/asset_pack
          zip -qr ../../flipdeflock_asset_pack.zip FlipDeFlock
          cd ../..
          ls -l flipdeflock_asset_pack.zip

      # Attach the built .fap to the Release for this tag.
      # - If the maintainer already created the release manually, this updates it
      #   (does not create a duplicate).
      # - The maintainer may also upload/release manually; this just automates it.
      - name: Attach .fap to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.assets.outputs.files }}
            flipdeflock_asset_pack.zip
          fail_on_unmatched_files: true
          # Auto-generate "What's Changed" notes when THIS workflow creates the
          # release (tag pushed with no release yet). If the maintainer pre-created
          # the release with hand-written notes, the action just attaches the .fap
          # and leaves those notes intact.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
