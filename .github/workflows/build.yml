name: "FAP: Build"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Same reasoning as esp32.yml: a second push to a PR makes the first run's
# result irrelevant, so let it go rather than queueing both. Nothing here
# publishes, so there is no tag exemption to make.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build .fap (${{ matrix.target }})"
    # One build per firmware family, because they do NOT share an API version.
    # A .fap carries the API it was built against and the loader refuses one that
    # does not match, so a single build only ever served whoever happened to be on
    # 87.1. Unleashed and RogueMaster are on 88.3 and were being told the app is
    # old -- correctly, from the loader's point of view.
    #
    # fail-fast is off on purpose: one firmware moving its API should not cancel
    # the builds for the others. That is precisely when you most want the rest.
    #
    # RogueMaster has no ufbt SDK index of its own. It tracks Unleashed and reports
    # the same 88.3 API, so this matrix builds the same SDK under RM's filename.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ofw
            api: "87.1"
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            api: "88.3"
            index: https://up.unleashedflip.com/directory.json
          # RM doesn't have a directory.json, however its close enough to unleashed
          - target: roguemaster
            api: "88.3"
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            api: "87.1"
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      # Named with the SAME action release.yml uses, so what you download from a
      # CI run is the file the README tells you to look for. Uploading ufbt's raw
      # artifact list instead would put identically-named flipdeflock.fap files in
      # four artifacts, plus the .fal that is already embedded in each.
      - name: Name the .fap for this firmware
        id: fap
        uses: ./.github/actions/name-fap
        with:
          fap-artifacts: ${{ steps.build-app.outputs.fap-artifacts }}
          target: ${{ matrix.target }}

      - name: Upload .fap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.fap.outputs.path }}
          if-no-files-found: error

      # --- Size report (advisory) ----------------------------------------------
      # The app image goes into the ~256 KB the Flipper shares between firmware
      # and app, and nothing was reporting how close to that it was. A user on
      # heavier firmware has already been refused outright with "Not enough RAM
      # to run the app" (issue #5), and a BLE transfer failed for the same reason
      # during field testing, so this is a lived limit rather than a theoretical
      # one.
      #
      # THE HEADLINE NUMBER IS THE LOADED IMAGE, NOT THE FILE. The .fap on disk
      # also carries embedded .fal plugins, which the firmware extracts to the SD
      # card instead of loading, plus debug and relocation data the loaded image
      # drops. Those diverge in the direction that matters: moving code into a
      # plugin makes the file bigger and the contiguous allocation smaller. The
      # budget percentage and the warning below therefore come from the ELF's
      # .text+.rodata+.data+.bss, and the file size is reported only as the
      # download size.
      #
      # Still ADVISORY: the loaded image is what the loader must place in one
      # contiguous block, but it is not the same question as free heap at launch,
      # which only hardware can answer. What this catches is a step change in a
      # diff, printed where a reviewer sees it, rather than found by somebody's
      # app failing to start. A jump in .bss is almost always a capacity constant
      # like RECON_FLOCK_MAX having been raised.
      - name: Size report (advisory)
        if: matrix.target == 'ofw'
        continue-on-error: true
        env:
          FAP_PATH: ${{ steps.fap.outputs.path }}
        run: |
          set -euo pipefail
          BUDGET=262144   # ~256 KB, the figure the project budgets against
          fap=$(stat -c%s "$FAP_PATH")

          # MEASURE THE LOADED IMAGE, NOT THE FILE. The .fap also carries
          # embedded .fal plugins as file assets, and those are extracted to the
          # SD card rather than loaded into the contiguous allocation. So moving
          # code INTO a plugin makes the .fap bigger while making the thing that
          # actually fails smaller -- exactly what happened when the ESP32
          # flasher moved out (.fap +4,248, loaded image -10,230). Reporting
          # .fap size alone would have called that a regression.
          ELF="$(find . -name 'flipdeflock_d.elf' -o -name 'flipdeflock.elf' 2>/dev/null | head -n1)"
          SIZE_BIN=""
          for c in arm-none-eabi-size size; do
            command -v "$c" >/dev/null 2>&1 && { SIZE_BIN="$c"; break; }
          done

          echo "### Size" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$(basename "$FAP_PATH")\` on disk: **$(printf "%'d" "$fap") bytes** (download size, includes embedded plugins)" >> "$GITHUB_STEP_SUMMARY"
          echo "$(basename "$FAP_PATH"): $fap bytes on disk"

          if [ -n "$ELF" ] && [ -n "$SIZE_BIN" ]; then
            loaded=$("$SIZE_BIN" -A "$ELF" | awk '
              $1 ~ /^\.(text|rodata|data|bss)$/ { t += $2 } END { print t+0 }')
            pct=$(( loaded * 100 / BUDGET ))
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Loaded image (.text+.rodata+.data+.bss): **$(printf "%'d" "$loaded") bytes**, ${pct}% of the ${BUDGET}-byte budget. **This is the number that matters** -- it is what the loader must place in one contiguous allocation." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            "$SIZE_BIN" -A "$ELF" | grep -E '^\.(text|rodata|data|bss)|^section' >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "loaded image: $loaded bytes (${pct}% of budget)"
            if [ "$pct" -ge 80 ]; then
              echo "::warning title=Loaded image size::$loaded bytes is ${pct}% of the ${BUDGET}-byte budget. Move a rarely-reached module to a .fal plugin, or measure heap on hardware, before adding more."
            fi
          else
            # Say so rather than quietly reporting only the file size, which
            # would read as the budget figure and is the misleading one.
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_Loaded-image size unavailable (no ELF or no \`size\` binary), so no budget percentage this run._" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Size report::could not measure the loaded image (ELF='$ELF', size bin='$SIZE_BIN'); only the on-disk .fap size was reported."
          fi

      # --- API drift guard (advisory) ------------------------------------------
      # Each target tracks its firmware's `release` channel, which floats: when a
      # firmware bumps its API version, that build follows it silently. This step
      # reads the API ufbt actually resolved and WARNS when it is not the version
      # recorded in the matrix, so a bump shows up as a line in the log rather than
      # as users being told the app is old.
      #
      # Still advisory (continue-on-error), for the original reason: the SDKs are
      # not pinned, so a required gate would turn CI red on somebody else's release
      # schedule. What the warning now means is "update matrix.api and the README
      # table", which is a deliberate edit rather than a mystery.
      - name: API drift check (advisory)
        continue-on-error: true
        uses: ./.github/actions/api-drift
        with:
          expected-api: ${{ matrix.api }}
          target: ${{ matrix.target }}
      - name: Lint sources (advisory)
        if: matrix.target == 'ofw'
        uses: flipperdevices/flipperzero-ufbt-action@e7cd34914e61ddc056acd8daaab96d8b4d4d9f55 # v0.1.4
        continue-on-error: true
        with:
          skip-setup: true
          task: lint

  # Host unit tests for the pure-logic modules (plain gcc, no SDK). Runs in
  # parallel with the .fap build. NOT continue-on-error: a failed check exits
  # non-zero and fails the workflow, so it gates merges (see test/README.md).
  host-tests:
    runs-on: ubuntu-latest
    name: "Host unit tests"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this checkout runs an authenticated git command.
          persist-credentials: false

      - name: Build + run host tests
        run: make -C test

      # The OUI tables are compiled into BOTH the .fap and the ESP sketch, from
      # two files, with no shared header (an Arduino sketch cannot include the
      # app's headers). Both carry a "keep in step by hand" comment and nothing
      # enforced it -- editing one side alone silently desyncs ESP-side scoring
      # from the Flipper's. Required, not advisory: a drift is a real detection
      # bug, and it is invisible at runtime.
      - name: OUI table parity (app vs ESP companion)
        run: python tools/check_oui_parity.py
