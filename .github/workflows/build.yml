name: "FAP: Build"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build .fap (${{ matrix.target }})"
    # One build per firmware family, because they do NOT share an API version.
    # A .fap carries the API it was built against and the loader refuses one that
    # does not match, so a single build only ever served whoever happened to be on
    # 87.1. Unleashed and RogueMaster are on 88.2 and were being told the app is
    # old -- correctly, from the loader's point of view.
    #
    # fail-fast is off on purpose: one firmware moving its API should not cancel
    # the builds for the others. That is precisely when you most want the rest.
    #
    # RogueMaster has no ufbt SDK index of its own. It tracks Unleashed and reports
    # the same 88.2, so the Unleashed build is the one to install there.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ofw
            api: "87.1"
            index: https://update.flipperzero.one/firmware/directory.json
          - target: unleashed
            api: "88.2"
            index: https://up.unleashedflip.com/directory.json
          - target: momentum
            api: "87.1"
            index: https://up.momentum-fw.dev/firmware/directory.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with ufbt
        id: build-app
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-index-url: ${{ matrix.index }}
          sdk-channel: release

      # Named with the SAME action release.yml uses, so what you download from a
      # CI run is the file the README tells you to look for. Uploading ufbt's raw
      # artifact list instead would put three identically-named flipdeflock.fap
      # files in three artifacts, plus the .fal that is already embedded in each.
      - name: Name the .fap for this firmware
        id: fap
        uses: ./.github/actions/name-fap
        with:
          fap-artifacts: ${{ steps.build-app.outputs.fap-artifacts }}
          target: ${{ matrix.target }}

      - name: Upload .fap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.target }}-${{ steps.build-app.outputs.suffix }}
          path: ${{ steps.fap.outputs.path }}
          if-no-files-found: error

      # --- API drift guard (advisory) ------------------------------------------
      # Each target tracks its firmware's `release` channel, which floats: when a
      # firmware bumps its API version, that build follows it silently. This step
      # reads the API ufbt actually resolved and WARNS when it is not the version
      # recorded in the matrix, so a bump shows up as a line in the log rather than
      # as users being told the app is old.
      #
      # Still advisory (continue-on-error), for the original reason: the SDKs are
      # not pinned, so a required gate would turn CI red on somebody else's release
      # schedule. What the warning now means is "update matrix.api and the README
      # table", which is a deliberate edit rather than a mystery.
      - name: API drift check (advisory)
        continue-on-error: true
        env:
          EXPECTED_API: ${{ matrix.api }}
        run: |
          set +e
          EXPECTED="$EXPECTED_API"

          # ufbt stores the resolved SDK state under its toolchain/SDK home.
          # UFBT_HOME is exported by the ufbt-action; fall back to the default.
          UFBT_STATE_DIR="${UFBT_HOME:-$HOME/.ufbt}"

          # The SDK's api_symbols.csv header / sdk.opts / .ufbt state records the
          # API version. We try a few known locations and parse the first hit.
          # Pattern: lines like `Version,87.1` in api_symbols.csv, or an
          # `"api"` field in the ufbt state json.
          API_VER=""

          # 1) api_symbols.csv: header row "api_symbol,..." with a Version,<x.y> row
          CSV=$(find "$UFBT_STATE_DIR" -name 'api_symbols.csv' 2>/dev/null | head -n1)
          if [ -n "$CSV" ]; then
            API_VER=$(grep -m1 -iE '^Version,' "$CSV" 2>/dev/null | cut -d',' -f2 | tr -d ' \r')
          fi

          # 2) ufbt state json (e.g. .ufbt/current/.data or sdk_state) -> "api" field
          if [ -z "$API_VER" ]; then
            JSON=$(find "$UFBT_STATE_DIR" -name '*.json' 2>/dev/null | head -n5)
            for f in $JSON; do
              V=$(grep -oiE '"api"[[:space:]]*:[[:space:]]*"?[0-9]+\.[0-9]+' "$f" 2>/dev/null \
                    | head -n1 | grep -oE '[0-9]+\.[0-9]+' | head -n1)
              if [ -n "$V" ]; then API_VER="$V"; break; fi
            done
          fi

          if [ -z "$API_VER" ]; then
            # Could not reliably determine the API version. Do NOT guess and do
            # NOT fail — just note it so a human can investigate if needed.
            echo "::warning title=API drift check::Could not determine the SDK API version ufbt built against (searched '$UFBT_STATE_DIR'). Skipping drift comparison. Expected API $EXPECTED."
            exit 0
          fi

          echo "Detected SDK API version: $API_VER (expected $EXPECTED)"
          if [ "$API_VER" != "$EXPECTED" ]; then
            echo "::warning title=API drift::the ${{ matrix.target }} SDK now reports API $API_VER, but the matrix records $EXPECTED. Update matrix.api and the firmware table in README.md. (Advisory -- build not failed.)"
          else
            echo "API version matches expected $EXPECTED."
          fi
          exit 0

      # Advisory, and only once. clang-format ships WITH the SDK, so three SDKs
      # means three formatter versions disagreeing about the same file; running it
      # per target would report the same code as three different verdicts. The
      # official SDK is the one CONTRIBUTING.md tells people to format against, so
      # that is the one that speaks.
      - name: Lint sources (advisory)
        if: matrix.target == 'ofw'
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        continue-on-error: true
        with:
          skip-setup: true
          task: lint

  # Host unit tests for the pure-logic modules (plain gcc, no SDK). Runs in
  # parallel with the .fap build. NOT continue-on-error: a failed check exits
  # non-zero and fails the workflow, so it gates merges (see test/README.md).
  host-tests:
    runs-on: ubuntu-latest
    name: "Host unit tests"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + run host tests
        run: make -C test

      # The OUI tables are compiled into BOTH the .fap and the ESP sketch, from
      # two files, with no shared header (an Arduino sketch cannot include the
      # app's headers). Both carry a "keep in step by hand" comment and nothing
      # enforced it -- editing one side alone silently desyncs ESP-side scoring
      # from the Flipper's. Required, not advisory: a drift is a real detection
      # bug, and it is invisible at runtime.
      - name: OUI table parity (app vs ESP companion)
        run: python tools/check_oui_parity.py
